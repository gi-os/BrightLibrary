name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight one; no point building a commit that is
# already stale.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Resolved here rather than in a step `if:`, because the `secrets` context
      # is not available in step-level conditionals - referencing it there fails
      # the whole workflow at startup with zero jobs run.
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the daemon to JetBrains 21.
      # Matching it here avoids Gradle auto-provisioning a second JDK over the
      # network on every run.
      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        # Optional. Set the four RELEASE_* secrets for a signed release APK.
        # Without them the release build is unsigned, and the debug APK - signed
        # with Android's standard debug key - is the one to sideload.
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          PROPS

      # One invocation, daemon left on. Three separate `--no-daemon` runs meant
      # three cold configuration phases and three JVM starts, which dominated
      # the wall time on a cache-cold runner.
      - name: Build and test
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          BASE=$(grep -oP 'val baseVersionName = "\K[^"]+' app/build.gradle.kts)
          VER="${BASE}-b${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/LightFastread-${VER}-debug.apk"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" \
             "out/LightFastread-${VER}-release.apk"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightFastread-${{ steps.collect.outputs.version }}
          path: out/*.apk
          if-no-files-found: error

      # Every push to main publishes a downloadable APK to Releases, so there is
      # always a current build to sideload without digging through workflow
      # artifacts (which expire, and need a login to download).
      - name: Publish build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LightFastread ${{ steps.collect.outputs.version }}
          files: out/*.apk
          make_latest: true
          body: |
            Automatic build of `${{ github.sha }}`.

            `versionCode` is the workflow run number (`${{ github.run_number }}`),
            so this installs straight over any earlier build:

            ```
            adb install -r LightFastread-${{ steps.collect.outputs.version }}-debug.apk
            ```

            The **debug** APK is signed with Android's standard debug key and is the
            one to sideload. The release APK is unsigned unless the `RELEASE_*`
            repository secrets are set.

      # Tagged releases are the hand-cut, human-notes ones.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
