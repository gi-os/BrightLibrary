name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  # light-common is pulled from GitHub Packages, which needs an authenticated read
  # even though the package is public.
  packages: read

# A newer push supersedes an in-flight one; no point building a commit that is
# already stale.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the daemon to JetBrains 21.
      # Matching it here avoids Gradle auto-provisioning a second JDK over the
      # network on every run.
      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing is mandatory, not optional. Android identifies an app by
      # (packageName, signing certificate): an update signed by a different key
      # is rejected outright, and an unsigned APK cannot install at all. Both
      # surface through Obtainium as the same unhelpful "Failure: Invalid".
      #
      # This step used to be conditional, which silently published unsigned
      # release APKs for eleven builds. Now a missing secret fails the build.
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Releases must be signed with a stable key or installed apps cannot be updated."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      # One invocation, daemon left on. Three separate `--no-daemon` runs meant
      # three cold configuration phases and three JVM starts, which dominated
      # the wall time on a cache-cold runner.
      - name: Build and test
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The signing certificate must never change, or every already-installed
      # copy becomes un-updatable. Pin its fingerprint in the repo and fail loudly
      # on any drift - including the case where the release silently falls back
      # to unsigned.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing - the release build produced an unsigned APK."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          # apksigner prints "V2 Signer: certificate SHA-256 digest: <hex>". The
          # number of ": " separators varies by signature scheme, so anchor on
          # the label and take everything after it rather than a field index.
          ACTUAL=$(grep -m1 -i 'certificate SHA-256 digest' /tmp/certs.txt \
                   | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' \r' | tr 'A-Z' 'a-z')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a certificate digest from apksigner output."
            exit 1
          fi
          EXPECTED=$(tr -d ' \r\n' < signing-fingerprint.txt | tr 'A-Z' 'a-z')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed. Every installed copy would fail to update. Restore the original keystore, or bump signing-fingerprint.txt only if you intend to break updates."
            exit 1
          fi

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          BASE=$(grep -oP 'val baseVersionName = "\K[^"]+' app/build.gradle.kts)
          VER="${BASE}-b${GITHUB_RUN_NUMBER}"
          # Exactly one APK ships. Publishing a debug build alongside it meant
          # Obtainium could pick either, and the debug one is signed with a
          # throwaway key the runner regenerates on every job.
          #
          # The file is still named LightFastread even though the app is LightBooks,
          # and the repo is still gi-os/LightFastread. Both on purpose: an installed
          # Obtainium source is pinned to the repo URL and may carry an APK filter
          # matching this filename, and neither is worth breaking on a device that
          # already works. The release *title* below is where the new name shows.
          cp app/build/outputs/apk/release/app-release.apk "out/LightFastread-${VER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debug-LightFastread-${VER}.apk"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload debug APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-LightFastread-${{ steps.collect.outputs.version }}
          path: debug-*.apk
          if-no-files-found: error

      # Every push to main publishes a downloadable APK to Releases, so Obtainium
      # always has a current build to pull.
      - name: Publish build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LightBooks ${{ steps.collect.outputs.version }}
          files: out/*.apk
          make_latest: true
          body: |
            Automatic build of `${{ github.sha }}`.

            ```
            adb install -r LightFastread-${{ steps.collect.outputs.version }}.apk
            ```

            `versionCode` is the workflow run number (`${{ github.run_number }}`) and
            every build is signed with the same key, so this updates in place — via
            `adb`, or via Obtainium.

            Signing certificate SHA-256 is pinned in
            [`signing-fingerprint.txt`](https://github.com/gi-os/LightFastread/blob/main/signing-fingerprint.txt);
            CI fails if it ever changes.

      # Tagged releases are the hand-cut, human-notes ones.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
