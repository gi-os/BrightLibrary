name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Resolved here rather than in a step `if:`, because the `secrets` context
      # is not available in step-level conditionals - referencing it there fails
      # the whole workflow at startup with zero jobs run.
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the daemon to JetBrains 21.
      # Matching it here avoids Gradle auto-provisioning a second JDK over the
      # network on every run.
      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        # Optional. Set the four RELEASE_* secrets for a signed release APK.
        # Without them the release build is unsigned, and the debug APK - signed
        # with Android's standard debug key - is the one to sideload.
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          PROPS

      - name: Lint Kotlin (compile only)
        run: ./gradlew --no-daemon compileDebugKotlin

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug + release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p out
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "out/FastRead-Light-${VER}-debug.apk"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" \
             "out/FastRead-Light-${VER}-release.apk"
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FastRead-Light-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
