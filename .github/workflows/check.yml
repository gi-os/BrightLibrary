name: Check

# Compiles and tests without publishing anything.
#
# build.yml only triggers on main, on tags, and on pull requests, so a push to a working
# branch ran no CI at all — the branch looked verified because the workflow list was green,
# when in fact nothing had been built. This runs on every other branch.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightFastread-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
